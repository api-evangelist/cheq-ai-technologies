aid: cheq-ai-technologies
name: CHEQ AI Technologies
description: >-
  CHEQ AI Technologies (CHEQ) is a go-to-market (GTM) security and digital
  intelligence company headquartered in Tel Aviv, Israel, with offices in New
  York, London, and Tokyo. CHEQ protects the customer journey by distinguishing
  legitimate humans from bots, fake users, and malicious AI agents across paid
  marketing, web forms, analytics, tag management, and consent. Its product
  suite includes CHEQ Acquisition (paid-media click-fraud and invalid-traffic
  protection), CHEQ Form Guard (bot form-submission blocking), CHEQ Analytics
  (human vs. non-human traffic analysis), CHEQ Manage (tag and third-party data
  governance), CHEQ Enforce (privacy/consent compliance), and CHEQ Agent Intent
  (real-time visitor intent and identity). CHEQ says it serves 15,000+ brands,
  processes 6 trillion signals daily across 1 million domains, and runs 2,000+
  real-time security tests per visitor. Its developer surface is delivered as
  server-side and client-side SDKs (Server-Side Tagging, Real-Time Interception
  middlewares, and Enforce consent SDKs across JavaScript/TypeScript, Kotlin,
  Swift, and Python) published under the npm @cheq.ai scope and the cheq-ai
  GitHub organization. CHEQ has acquired Deduce (identity intelligence) and
  ClickCease (click-fraud protection).
